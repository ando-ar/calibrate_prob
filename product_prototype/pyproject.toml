[project]
name = "product-prototype"
version = "0.1.0"
description = "Reproducible acquisition and ranking experiments for recruitment recommendations"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2,<2",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "pyarrow>=19",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
redshift = ["redshift-connector>=2.1,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
product-prototype = "product_prototype.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
