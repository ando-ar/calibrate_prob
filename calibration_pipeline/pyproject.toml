[project]
name = "calibration-pipeline"
version = "0.1.0"
description = "Daily batch calibration of recruitment referral candidate scores"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10,<2",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "polars>=1.24,<2",
    "scikit-learn>=1.6,<2",
    "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
redshift = ["redshift-connector>=2.1,<3", "sqlalchemy-redshift>=1,<2"]

[project.scripts]
calibration-pipeline = "calibration_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[dependency-groups]
docs = [
    "myst-parser>=4,<6",
    "sphinx>=8.2,<9",
    "sphinx-rtd-theme>=3.1,<4",
    "sphinx-autobuild>=2024.10.3,<2027",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]

[tool.ruff.lint]
extend-select = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
