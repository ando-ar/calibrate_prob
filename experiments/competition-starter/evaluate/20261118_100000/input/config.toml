# Baseline run: warmup-trained model scores applied to evaluation-day candidates.
# See synthetic_funnel/docs/COMPETITION.md §§6-8 and starter_kit/README.md.

[run]
experiment_name = "competition-starter"
stage = "evaluate"
author = "starter-kit"
hypothesis = "Warmup-trained stage scores (p_apply x p_screen x p_decision) x fee_if_decided_yen are the reference baseline; a participant method should beat it on macro_daily_replay_fee_yen."
git_commit = "f81b2ba91555fd5673f458c3e13cc48fbc260eb0"
evaluator_version = "synthetic-funnel 0.12.0 / issue #35 evaluator (SCHEMA_VERSION=1)"

[data]
manifest = "starter_kit/data/proof/participant/manifest.json"
manifest_sha256 = "355ae51c71fc0ad6c6750d859210874a8b13802cb65bfe94e64431de3b8c6282" # actual regeneration; documented 3f55683a... differs (generation_seconds is nondeterministic)
horizon_days = 90 # 3 calendar months (COMPETITION.md §3.2 default)

[seeds]
market = 71
participant = 0 # deterministic ranking; no participant RNG consumed
sql = 0

[learning]
max_training_rows = 300000 # 50000-500000; full extraction is not allowed
extraction_strategy = "warmup-balanced refit (302k observed warmup events, 3 stage models; 616/68/18 rows, positives 308/34/9)"
# Actual acquired counts and selection rates are recorded in run_metadata.json.

[ranking]
max_per_user_per_day = 5
daily_budget_per_active_user = 5
# daily_budget = null
ranking_rule = "stage_product_times_fee"
fee_rate = 0.33

[submission]
path = "starter_kit/data/proof/participant/submission.parquet"
metadata = "starter_kit/data/proof/participant/submission_metadata.json"

[dataset]
variant = "proof"
market_start = "2025-01-01T00:00:00+09:00"
seed = 71
days = 730
warmup = 365
seeker_arrivals = 20
job_arrivals = 20
evaluation_day_offsets = [400, 401, 402]
production_reference = "days=1825, arrivals=50/50, evaluation offsets [730,760) — generated by organisers later"
